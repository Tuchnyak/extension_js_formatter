<!doctype html>
<html lang="en" class="jv-app">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Curly - JSON Formatter &amp; Tree Viewer</title>
	</head>
	<body>
		<main>
			<header>
				<h1>Curly</h1>
				<div id="controls"></div>
			</header>
			<textarea
				id="input"
				spellcheck="false"
				placeholder="Paste JSON here"
				aria-label="JSON input"
			></textarea>
			<div class="actions">
				<button id="format" type="button">Format</button>
				<span class="hint">Ctrl/Cmd+Enter</span>
			</div>
			<div id="result"></div>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
